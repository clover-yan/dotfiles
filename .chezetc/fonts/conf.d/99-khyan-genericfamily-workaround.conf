<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    fontconfig 2.18 adds the "genericfamily" property in 48-guessfamily.conf.
    Chromium <= 155 bundles fontconfig 2.17.1, which mis-parses the new
    <const xsi:nil="true"/> / genericfamily rules and then resolves
    system-ui / "Sans" to Noto Sans.  Dropping the bogus property restores
    the normal substitution chain (system-ui -> sans-serif -> Inter).
    This also keeps Noto Sans available for normal requests.
  -->
  <match target="pattern">
    <edit name="genericfamily" mode="delete"/>
  </match>
</fontconfig>
