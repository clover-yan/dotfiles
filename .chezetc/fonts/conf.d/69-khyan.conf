<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
	<match target="pattern">
		<test name="family">
			<string>宋体</string>
		</test>
		<edit name="family" mode="prepend" binding="strong">
			<string>新致宋体</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family">
			<string>黑体</string>
		</test>
		<edit name="family" mode="prepend" binding="strong">
			<string>新晰黑体</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family">
			<string>SimSun</string>
		</test>
		<edit name="family" mode="prepend" binding="strong">
			<string>SimZhiSong</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family">
			<string>SimHei</string>
		</test>
		<edit name="family" mode="prepend" binding="strong">
			<string>SimXiHei</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family">
			<string>system-ui</string>
		</test>
		<edit name="family" mode="prepend" binding="strong">
			<string>sans-serif</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family">
			<string>ui-monospace</string>
		</test>
		<edit name="family" mode="prepend" binding="strong">
			<string>monospace</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family">
			<string>sans-serif</string>
		</test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Inter Variable Khyan</string>
			<string>Noto Sans</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family">
			<string>monospace</string>
		</test>
		<edit name="family" mode="prepend" binding="strong">
			<string>CommitMono-Khyan</string>
			<string>MapleMono NF CN</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family">
			<string>serif</string>
		</test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Gelasio</string>
			<string>Noto Serif</string>
		</edit>
	</match>
	<match target="font">
		<test name="family" compare="contains">
			<string>Noto Sans</string>
		</test>
		<edit name="fontfeatures" mode="append">
			<string>halt</string>
		</edit>
	</match>
</fontconfig>
